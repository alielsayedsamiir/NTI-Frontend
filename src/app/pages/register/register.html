<div style="max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
  <h2>Register</h2>
  @if (errorMessage) {
    <p style="color: red;">{{ errorMessage }}</p>
  }
  <form (ngSubmit)="onSubmit()">
    <div style="margin-bottom: 15px;">
      <label>Name:</label>
      <input type="text" [(ngModel)]="user.name" name="name" required style="width: 100%; padding: 8px;">
    </div>
    <div style="margin-bottom: 15px;">
      <label>Email:</label>
      <input type="email" [(ngModel)]="user.email" name="email" required style="width: 100%; padding: 8px;">
    </div>
    <div style="margin-bottom: 15px;">
      <label>Password:</label>
      <input type="password" [(ngModel)]="user.password" name="password" required style="width: 100%; padding: 8px;">
    </div>
    <div style="margin-bottom: 15px;">
      <label>Role:</label>
      <select [(ngModel)]="user.role" name="role" style="width: 100%; padding: 8px;">
        <option value="student">Student</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <button type="submit" style="width: 100%; padding: 10px; background: #28a745; color: white; border: none; cursor: pointer;">
      Register
    </button>
  </form>
  <p style="margin-top: 15px;">Already have an account? <a routerLink="/login">Login here</a></p>
</div>
