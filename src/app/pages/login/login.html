<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow-lg p-4 rounded-4 border-0" style="width: 100%; max-width: 400px;">
    <div class="text-center mb-4">
      <i class="bi bi-person-circle fs-1 text-primary"></i>
      <h3 class="fw-bold mt-2">Welcome Back</h3>
      <p class="text-muted small">Please enter your credentials to login</p>
    </div>

    <form (ngSubmit)="onLogin()">
      <div class="mb-3">
        <label class="form-label text-secondary small fw-semibold">Email or Username</label>
        <input 
          type="text" 
          class="form-control form-control-lg rounded-3 fs-6" 
          placeholder="Enter email or username"
          [(ngModel)]="email" 
          name="email"
          required>
      </div>

      <div class="mb-4">
        <label class="form-label text-secondary small fw-semibold">Password</label>
        <input 
          type="password" 
          class="form-control form-control-lg rounded-3 fs-6" 
          placeholder="Enter password"
          [(ngModel)]="password" 
          name="password"
          required>
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 fs-6 shadow-sm mb-3">
        Sign In
      </button>
    </form>
  </div>
</div>
